name: Potato Ducks print pack

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check print projects and package
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/potato-ducks-73559.zip" HEAD
          python3 - "$RUNNER_TEMP/potato-ducks-73559.zip" <<'PY'
          import io
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as pack:
              assert pack.testzip() is None, "Corrupt print pack"
              expected = (
                  "print/coin/Potato_Ducks_H2C_4color_CONFIGURED.3mf",
                  "print/mascot/Potato_Duck_Mascot_H2C_4color.3mf",
              )
              for path in expected:
                  with zipfile.ZipFile(io.BytesIO(pack.read(path))) as project:
                      assert project.testzip() is None, path
                      assert "3D/3dmodel.model" in project.namelist(), path
          PY

  release:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Publish versioned print pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="v1.0.$GITHUB_RUN_NUMBER"
          pack="$RUNNER_TEMP/potato-ducks-73559-$version.zip"
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $version already exists."
            exit 0
          fi
          git archive --format=zip --output="$pack" "$GITHUB_SHA"
          gh release create "$version" "$pack" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Potato Ducks print pack $version" --generate-notes
